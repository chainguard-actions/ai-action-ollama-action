name: Test with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake ollama binary
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nif [ "$1" = "run" ]; then\n  echo "Hello"\n  exit 0\nfi\nexit 0\n' > "$HOME/bin/ollama"
          chmod +x "$HOME/bin/ollama"
          sudo cp "$HOME/bin/ollama" /usr/local/bin/ollama
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          model: tinyllama
          prompt: "Say hello in one word"
          cache: "false"

      - name: Assert response is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.response }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected a non-empty response when cache is disabled"
            exit 1
          fi
          echo "PASS: got response with cache disabled"
