name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock ollama binary
        run: |
          # Create a mock ollama binary that responds to all commands
          # Place in /usr/local/bin which is early in PATH
          sudo tee /usr/local/bin/ollama > /dev/null << 'SCRIPT'
          #!/bin/bash
          case "$1" in
            run)
              echo "Hello"
              ;;
            pull)
              echo "pulled model"
              ;;
            serve)
              # Pretend to serve; setup-ollama may call this
              sleep 86400 &
              exit 0
              ;;
            --version|version)
              echo "ollama version 0.6.5"
              ;;
            list|ps)
              echo ""
              ;;
            *)
              echo "ollama mock: $*"
              ;;
          esac
          SCRIPT
          sudo chmod +x /usr/local/bin/ollama
          echo "Mock ollama installed: $(which ollama)"
          ollama run tinyllama "test"

      - id: action
        uses: .
        with:
          model: tinyllama
          prompt: "Say hello in one word"
          cache: "false"

      - name: Assert response is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.response }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected a non-empty response"
            exit 1
          fi
          echo "PASS"
