name: ollama-action
description: Run Ollama large language models (LLMs) with GitHub Actions
author: remarkablemark
inputs:
  model:
    description: Language model name
    required: true
  prompt:
    description: Input prompt to generate a response for
    required: true
  version:
    description: Ollama version
    required: false
  cache:
    description: Whether to cache the model
    required: false
    default: true
outputs:
  response:
    description: Generated response message
    value: ${{ steps.model.outputs.response }}
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Setup Ollama
      if: ${{ !inputs.version }}
      uses: ai-action/setup-ollama@591531fff1153f90ea7a512c1c528231856f1036 # v2
    - name: Setup Ollama v${{ inputs.version }}
      if: inputs.version
      uses: ai-action/setup-ollama@591531fff1153f90ea7a512c1c528231856f1036 # v2
      with:
        version: ${{ inputs.version }}
    - name: Cache model
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ollama
        key: ollama-action-${{ runner.os }}
    - name: Run model
      id: model
      shell: bash
      run: |
        SAFE_MODEL=$(printf '%s' "$MODEL" | tr -d '\n\r')
        SAFE_PROMPT=$(printf '%s' "$PROMPT" | tr -d '\n\r')
        EOF=EOF_OLLAMA_$(openssl rand -hex 12)
        {
          echo "response<<$EOF"
          ollama run "$SAFE_MODEL" "$(printf '%q' "$SAFE_PROMPT")"
          echo "$EOF"
        } >> "$GITHUB_OUTPUT"
      env:
        MODEL: ${{ inputs.model }}
        PROMPT: ${{ inputs.prompt }}
branding:
  icon: terminal
  color: gray-dark
